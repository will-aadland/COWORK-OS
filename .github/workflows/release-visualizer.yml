name: Release Visualizer

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: visualizer/package-lock.json

      - name: Install dependencies
        working-directory: visualizer
        run: npm ci

      - name: Build installer
        working-directory: visualizer
        run: npm run dist

      - name: Get version from package.json
        id: pkg
        shell: bash
        run: |
          VERSION=$(node -p "require('./visualizer/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release and upload installer
        uses: softprops/action-gh-release@v2
        with:
          name: "Promega Project Planner v${{ steps.pkg.outputs.version }}"
          body: |
            ## Promega Project Planner v${{ steps.pkg.outputs.version }}

            Windows installer for the Promega Project Planner V3 Visualizer — the desktop app that works alongside the CoWork Claude plugin.

            ### Install

            1. Download **`Promega.Project.Planner.Setup.${{ steps.pkg.outputs.version }}.exe`** below
            2. Double-click the installer
            3. If Windows SmartScreen warns you, click **More info → Run anyway** (the build is unsigned)
            4. Choose your install location and optionally create desktop / Start Menu shortcuts
            5. Launch from the Start Menu or desktop shortcut

            ### First run

            On first launch the app will ask you to point it at your CoWork workspace folder (the folder Claude writes to). Pick the same path you configured in `/begin`.

            ### What's in this release

            | File | Purpose |
            |------|---------|
            | `Promega.Project.Planner.Setup.${{ steps.pkg.outputs.version }}.exe` | Windows NSIS installer (~78 MB, self-contained) |
            | `*.blockmap` | Differential update map (can be ignored for manual installs) |

            See [GETTING_STARTED.html](https://github.com/will-aadland/COWORK-OS/blob/main/GETTING_STARTED.html) for the full setup guide.
          files: |
            visualizer/dist-app/*.exe
            visualizer/dist-app/*.blockmap
          draft: false
          prerelease: false
